# Identidade visual: campo verde, superfícies claras e fonte sem serifa.
[theme]
base = "light"
primaryColor = "#176B4D"
backgroundColor = "#F7F8F2"
secondaryBackgroundColor = "#EDF1E7"
textColor = "#172C26"
borderColor = "#D8E1D5"
font = "sans-serif"
headingFont = "sans-serif"
showWidgetBorder = true
showSidebarBorder = true
paddingTop = "1.25rem"
chartCategoricalColors = ["#176B4D", "#C98618", "#4F7CAC", "#9F5262"]

[theme.sidebar]
backgroundColor = "#EDF1E7"
secondaryBackgroundColor = "#F7F8F2"
